name: Tests

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg for synthetic audio integration tests
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install project
        run: python -m pip install -e .
      - name: Compile Python modules
        run: python -m compileall -q src tests
      - name: Smoke test published TKKGData provider contracts
        run: |
          python - <<'PY'
          from tkkgdownloader.episodes import fetch_catalog
          from tkkgdownloader.audio_sources import validate_audio_release

          catalog = fetch_catalog()
          assert 218 in catalog, "Episode 218 is missing from TKKGData"
          episode = catalog[218]
          spotify = validate_audio_release(episode.audio_release, provider="spotisaver")
          youtube = validate_audio_release(episode.audio_release, provider="yt-dlp")
          assert spotify["track_count"] == 25, (
              f"Episode 218 Spotify list changed: {spotify['track_count']} tracks"
          )
          assert youtube["track_count"] == 35, (
              f"Episode 218 YouTube Music list changed: {youtube['track_count']} tracks"
          )
          assert spotify["tracks"][0]["spotify_track_url"].startswith(
              "https://open.spotify.com/track/"
          )
          assert youtube["tracks"][0]["youtube_music_url"].startswith(
              "https://music.youtube.com/watch?v="
          )
          assert 19 in catalog and catalog[19].audio_unavailable_reason
          assert 20 in catalog and catalog[20].audio_unavailable_reason
          assert 37 in catalog and catalog[37].audio_unavailable_reason
          print(
              f"Fetched {len(catalog)} episodes. Episode 218 has "
              f"{spotify['track_count']} Spotify tracks and "
              f"{youtube['track_count']} YouTube Music tracks. "
              "Known unavailable registry loaded."
          )
          PY
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
