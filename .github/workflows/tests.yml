name: Tests

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e .
      - name: Compile Python modules
        run: python -m compileall -q src tests
      - name: Smoke test published TKKGData contract
        run: |
          python - <<'PY'
          from tkkgdownloader.episodes import fetch_catalog
          from tkkgdownloader.audio_sources import validate_audio_release

          catalog = fetch_catalog()
          assert 150 in catalog, "Episode 150 is missing from TKKGData"
          episode = catalog[150]
          plan = validate_audio_release(episode.audio_release)
          assert plan["track_count"] == 40, "Episode 150 must expose all 40 verified tracks"
          assert plan["youtube_music_playlist_url"] == (
              "https://music.youtube.com/playlist?list="
              "OLAK5uy_mQRbJNANh1H4CKbmM5ez5LSW1HJFvE3QI"
          ), "Episode 150's verified YouTube Music playlist changed"
          assert len(plan["tracks"]) == 40
          assert plan["tracks"][0]["youtube_music_url"].startswith(
              "https://music.youtube.com/watch?v="
          )
          assert plan["tracks"][0]["spotify_track_url"].startswith(
              "https://open.spotify.com/track/"
          )
          print(
              f"Fetched {len(catalog)} TKKGData episodes. "
              f"Episode 150 has {plan['track_count']} verified Spotify and YouTube Music pairs."
          )
          PY
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
